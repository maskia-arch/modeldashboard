version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: model_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: model_dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - model_network

  # 2. Redis 7 Cache & BullMQ Queue Broker
  redis:
    image: redis:7-alpine
    container_name: model_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - model_network

  # 3. Next.js App Service
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: model_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/model_dashboard?schema=public
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: https://model.autoacts.link
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-super-secret-random-key-32-chars-minimum-autoacts}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-autoacts-models}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING}
      XAI_API_KEY: ${XAI_API_KEY}
      XAI_MODEL: ${XAI_MODEL:-grok-beta}
      TON_API_ENDPOINT: ${TON_API_ENDPOINT:-https://toncenter.com/api/v2/jsonRPC}
      TON_API_KEY: ${TON_API_KEY}
      STAR_USD_RATE: ${STAR_USD_RATE:-0.013}
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - model_network

  # 4. Background Worker Service (BullMQ & MTProto GramJS)
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: model_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/model_dashboard?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_STRING: ${TELEGRAM_SESSION_STRING}
      STAR_USD_RATE: ${STAR_USD_RATE:-0.013}
      NODE_ENV: production
    networks:
      - model_network

  # 5. Caddy Reverse Proxy (SSL & Routing for model.autoacts.link)
  caddy:
    image: caddy:2-alpine
    container_name: model_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - model_network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  model_network:
    driver: bridge
